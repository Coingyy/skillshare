name: Security-Check

on:
  pull_request:
    paths:
      - "skills.json"

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate schema
        run: |
          pip install jsonschema
          python - <<'EOF'
          import json, jsonschema
          data = json.load(open("skills.json", encoding="utf-8"))
          schema = json.load(open("schema/skills.schema.json", encoding="utf-8"))
          jsonschema.validate(data, schema)
          ids = [s["id"] for s in data["skills"]]
          assert len(ids) == len(set(ids)), f"Duplicate ids: {set(i for i in ids if ids.count(i) > 1)}"
          print(f"Schema OK — {len(ids)} entries.")
          EOF

      - name: Scan new repos
        id: scan
        run: |
          git fetch origin ${{ github.base_ref }}
          python scripts/security_scan.py --base-ref "origin/${{ github.base_ref }}" --report security-report.md

      - name: Post report as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('security-report.md')) return;
            const body = fs.readFileSync('security-report.md', 'utf8');
            const marker = '<!-- skillshare-security-scan -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            const payload = { owner: context.repo.owner, repo: context.repo.repo, body: marker + '\n' + body };
            if (existing) {
              await github.rest.issues.updateComment({ ...payload, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...payload, issue_number: context.issue.number });
            }
