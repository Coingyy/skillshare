name: Security-Check
on:
  pull_request:
    paths: [skills.json]
permissions:
  contents: read
  actions: read
jobs:
  scan:
    # This exact bot path already completed scanner + AI before creating its
    # append-only PR and attests the exact commit. Avoid a second paid review.
    # Every other PR, including forks and other bots, follows this job.
    if: github.event.pull_request.user.login != 'github-actions[bot]' || !startsWith(github.event.pull_request.head.ref, 'codex/submission-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Execute only trusted base-branch scripts. Read PR skills.json as data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Validate metadata, scan and review changed entries
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_pr.py
      - name: Preserve review or legacy migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-${{ github.run_id }}
          path: |
            pr-review.json
            normalized-catalog.json
          if-no-files-found: ignore
