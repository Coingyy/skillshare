name: Process submission

on:
  issues:
    types: [opened, reopened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing submission issue to retry
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: submission-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  process:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'skill-submission')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Scan, review with OpenAI, validate and merge
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: python scripts/process_submission.py --issue "$ISSUE_NUMBER"
      - name: Keep scan and AI evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            submission-evidence.json
            submission-review.json
          if-no-files-found: ignore
          retention-days: 90
